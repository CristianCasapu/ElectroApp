    <circle cx="790" cy="235" r="88" fill="#FFB300"/>
    <circle cx="784" cy="229" r="60" fill="#FFD54F"/>
    <!-- Fișa de lucrare -->
    <g transform="rotate(-7 310 475)" filter="url(#sh)">
      <rect x="150" y="250" width="320" height="450" rx="28" fill="#FAFAFA"/>
      <rect x="245" y="222" width="130" height="68" rx="18" fill="#37474F"/>
      <g>
        <rect x="195" y="338" width="64" height="64" rx="14" fill="#34C759"/>
        <polyline points="209,372 222,386 246,355" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="287" y="358" width="138" height="24" rx="12" fill="#B0BEC5"/>
        <rect x="195" y="458" width="64" height="64" rx="14" fill="#34C759"/>
        <polyline points="209,492 222,506 246,475" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="287" y="478" width="138" height="24" rx="12" fill="#B0BEC5"/>
        <rect x="199.5" y="582.5" width="55" height="55" rx="12" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="9"/>
        <rect x="287" y="598" width="138" height="24" rx="12" fill="#B0BEC5"/>
