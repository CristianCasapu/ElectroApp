        <polygon points="342,372 406,372 342,436"/><polygon points="472,372 536,372 472,436"/><polygon points="602,372 666,372 602,436"/>
        <polygon points="342,502 406,502 342,566"/><polygon points="472,502 536,502 472,566"/><polygon points="602,502 666,502 602,566"/>
        <polygon points="342,632 406,632 342,696"/><polygon points="472,632 536,632 472,696"/><polygon points="602,632 666,632 602,696"/>
      </g>
