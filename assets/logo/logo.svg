      <rect x="300" y="330" width="460" height="460" rx="30" fill="#CFD8DC"/>
      <rect x="322" y="352" width="416" height="416" rx="16" fill="#0B1F3A"/>
      <g fill="#1E88E5">
        <rect x="342" y="372" width="116" height="116" rx="10"/><rect x="472" y="372" width="116" height="116" rx="10"/><rect x="602" y="372" width="116" height="116" rx="10"/>
        <rect x="342" y="502" width="116" height="116" rx="10"/><rect x="472" y="502" width="116" height="116" rx="10"/><rect x="602" y="502" width="116" height="116" rx="10"/>
        <rect x="342" y="632" width="116" height="116" rx="10"/><rect x="472" y="632" width="116" height="116" rx="10"/><rect x="602" y="632" width="116" height="116" rx="10"/>
      </g>
