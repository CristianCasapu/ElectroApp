      <rect x="640" y="640" width="240" height="240" rx="34" fill="#37474F"/>
      <rect x="666" y="666" width="188" height="94" rx="18" fill="#607D8B"/>
      <circle cx="820" cy="708" r="18" fill="#34C759"/>
      <g fill="#607D8B">
        <rect x="676" y="790" width="168" height="8" rx="4"/><rect x="676" y="812" width="168" height="8" rx="4"/>
        <rect x="676" y="834" width="168" height="8" rx="4"/><rect x="676" y="856" width="168" height="8" rx="4"/>
      </g>
      <polygon points="760,590 712,690 752,690 728,770 808,660 764,660 790,590" fill="#FFD54F"/>
    </g>
