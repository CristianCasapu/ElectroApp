<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ElectroApp — panou fotovoltaic, invertor, fișă de lucrare cu bife, soare.
       Echivalentul vectorial al assets/logo/logo_1024.png (scripts/logo.py). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1259C3"/>
      <stop offset="1" stop-color="#072860"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(0.92) translate(-512 -512)">
    <!-- Soare -->
    <g stroke="#FFB300" stroke-width="16" stroke-linecap="round">
      <line x1="790" y1="105" x2="790" y2="77"/><line x1="790" y1="365" x2="790" y2="393"/>
      <line x1="660" y1="235" x2="632" y2="235"/><line x1="920" y1="235" x2="948" y2="235"/>
      <line x1="698" y1="143" x2="678" y2="123"/><line x1="882" y1="327" x2="902" y2="347"/>
      <line x1="882" y1="143" x2="902" y2="123"/><line x1="698" y1="327" x2="678" y2="347"/>
      <line x1="729" y1="117" x2="717" y2="90"/><line x1="851" y1="353" x2="863" y2="380"/>
      <line x1="908" y1="174" x2="935" y2="162"/><line x1="672" y1="296" x2="645" y2="308"/>
